<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#146e63">
  <meta name="description" content="신림수요·신림토요 GA 모임 현황과 출석 기록">
  <title>GA · 함께 이어가는 회복</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --paper: #fff;
      --ink: #183b36;
      --muted: #71857e;
      --brand: #146e63;
      --soft: #e4f1ec;
      --line: #dfe9e3;
      --red: #bf5261;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 system-ui, -apple-system, 'Noto Sans KR', sans-serif;
      letter-spacing: -.025em;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #dbad4e;
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    /* ===== 비밀번호 잠금 화면 ===== */
    .lock-screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
    }
    .lock-card {
      width: min(390px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 24px 24px;
      box-shadow: 0 18px 50px #146e6314;
      text-align: center;
    }
    .lock-card.shake {
      animation: lockShake .36s ease;
    }
    @keyframes lockShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
    .lock-logo {
      margin: 0 auto 14px;
    }
    .lock-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .lock-sub {
      margin: 6px 0 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .pin-field {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .pin-field input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 44px 12px 14px;
      font-size: 16px;
      background: #fafcfb;
      letter-spacing: .12em;
      text-align: center;
    }
    .pin-field input:focus {
      border-color: var(--brand);
      background: #fff;
    }
    .pin-toggle {
      position: absolute;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      display: grid;
      place-items: center;
    }
    .pin-toggle:hover { background: var(--soft); color: var(--brand); }
    .keep-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 4px 0 16px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }
    .keep-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--brand);
      cursor: pointer;
    }
    .lock-submit {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 750;
      transition: opacity .15s, transform .1s;
    }
    .lock-submit:hover:not(:disabled) { opacity: .93; }
    .lock-submit:active:not(:disabled) { transform: scale(.99); }
    .lock-submit:disabled { opacity: .6; cursor: wait; }
    .lock-error {
      min-height: 20px;
      margin: 12px 0 0;
      font-size: 12px;
      font-weight: 650;
      color: var(--red);
    }
    .lock-hint {
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px solid #edf2ee;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* ===== 대시보드 기존 스타일 ===== */
    header, .controls, .identity, .dialog-head, .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .shell {
      max-width: 1120px;
      margin: auto;
      padding: 0 24px;
    }
    header { padding: 26px 0 20px; gap: 12px; }
    .identity { justify-content: flex-start; gap: 12px; }
    .identity b { font-size: 20px; letter-spacing: -.05em; }
    .identity small { display: block; font-size: 12px; color: var(--muted); }
    .logo {
      height: 46px;
      width: 46px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-size: 19px;
      font-weight: 850;
      border-radius: 15px;
      position: relative;
    }
    .logo span {
      position: absolute;
      right: 4px;
      top: 1px;
      color: #d5b362;
      font-size: 9px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .readonly {
      font-size: 11px;
      border: 1px solid #c9dcd2;
      border-radius: 20px;
      padding: 4px 9px;
      white-space: nowrap;
      color: var(--brand);
      background: var(--paper);
    }
    .lock-btn {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #d9c8cb;
      border-radius: 20px;
      padding: 4px 10px;
      white-space: nowrap;
      color: var(--red);
      background: #fff;
      transition: background .15s;
    }
    .lock-btn:hover { background: #fdf3f4; }
    .controls { gap: 12px; }
    .groups {
      display: flex;
      background: #e5ebe7;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .groups button {
      padding: 9px 20px;
      border-radius: 9px;
      background: transparent;
      font-weight: 750;
      color: var(--muted);
    }
    .groups .active {
      background: var(--brand);
      color: white;
      box-shadow: 0 3px 8px #146e6320;
    }
    .period-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    select {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      padding: 7px 9px;
      margin-left: 4px;
    }
    nav {
      display: flex;
      border-bottom: 1px solid var(--line);
      gap: 26px;
      margin: 16px 0 10px;
    }
    nav button {
      position: relative;
      padding: 11px 0;
      background: none;
      color: var(--muted);
      font-weight: 750;
    }
    nav .active { color: var(--brand); }
    nav .active:after {
      position: absolute;
      content: '';
      height: 3px;
      background: var(--brand);
      bottom: -1px;
      left: 0;
      right: 0;
      border-radius: 4px;
    }
    .data-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin: 8px 0 16px;
      padding: 8px 11px;
      background: #eaf0e8;
      border-radius: 8px;
    }
    .refresh-feed {
      background: var(--paper);
      border: 1px solid #c9dcd2;
      color: var(--brand);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .page-title { margin: 0; font-size: 26px; letter-spacing: -.06em; line-height: 1.25; }
    .subtitle { font-size: 12px; color: var(--muted); margin: 5px 0 16px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-width: 0;
    }
    .stat:first-child {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .stat label { font-size: 12px; display: block; opacity: .85; }
    .stat strong {
      font-size: 31px;
      letter-spacing: -.06em;
      line-height: 1.2;
      display: inline-block;
      margin-top: 6px;
    }
    .stat strong small { font-size: 13px; font-weight: 500; margin-left: 4px; }
    .stat p { font-size: 10px; margin: 5px 0 0; opacity: .75; }
    .stat-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-top: 6px;
    }
    .nav-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 0;
      transition: background .15s;
    }
    .nav-arrow:hover:not(:disabled) { background: rgba(255, 255, 255, 0.3); }
    .nav-arrow:disabled { opacity: .3; cursor: default; }
    .nav-arrow.light {
      background: var(--soft);
      color: var(--brand);
    }
    .nav-arrow.light:hover:not(:disabled) { background: #d0e6de; }
    .session-nav-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .point-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 750;
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid #c9dcd2;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 14px;
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      min-width: 0;
    }
    .section-head { gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .section-head h2 { font-size: 16px; margin: 0; }
    .section-head span { font-size: 11px; color: var(--muted); }
    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .chart text { font-family: inherit; font-size: 11px; fill: var(--muted); }
    .chart .gridline { stroke: #e8efea; stroke-width: 1; }
    .chart .line { stroke: var(--brand); stroke-width: 2.6; fill: none; stroke-linejoin: round; }
    .chart .dot { fill: var(--brand); transition: r .15s; }
    .chart .dot.active { fill: #fff; stroke: var(--brand); stroke-width: 3; }
    .chart .hit { fill: transparent; cursor: pointer; }
    .caption { font-size: 10px; color: var(--muted); margin: 8px 0 0; }
    .list { display: grid; gap: 0; }
    .person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #edf2ee;
      padding: 9px 0;
      text-align: left;
      background: none;
      width: 100%;
    }
    .person:last-child { border: 0; }
    .person b { font-size: 13px; }
    .person span { font-size: 12px; color: var(--muted); text-align: right; }
    .person .celebration, .celebration { color: var(--red); font-weight: 700; }
    .celebration-group { margin-top: 12px; }
    .celebration-group:first-child { margin-top: 0; }
    .celebration-month-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 750;
      color: var(--brand);
      background: var(--soft);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 4px;
    }
    .celebration-month-head span {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .tag {
      background: var(--soft);
      color: var(--brand);
      font-size: 10px;
      border-radius: 6px;
      padding: 2px 6px;
      margin-left: 6px;
    }
    .empty { padding: 30px 8px; color: var(--muted); text-align: center; font-size: 13px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .tools input {
      min-width: 100px;
      flex: 1;
      border: 1px solid var(--line);
      background: white;
      padding: 9px 12px;
      border-radius: 9px;
    }
    .tools select { margin: 0; max-width: 180px; }
    .table-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      max-height: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      scrollbar-width: thin;
    }
    table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; white-space: nowrap; }
    th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid #edf2ee; min-width: 54px; }
    thead th { position: sticky; top: 0; background: #edf3ef; z-index: 2; color: var(--muted); font-weight: 650; }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background: white;
      text-align: left;
      min-width: 92px;
      z-index: 1;
      border-right: 1px solid var(--line);
    }
    thead th:first-child { z-index: 3; background: #edf3ef; }
    .name-btn { background: none; padding: 0; font-weight: 750; text-align: left; }
    .name-btn small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; }
    .yes { color: var(--brand); font-size: 17px; }
    .no { color: #c7d2cb; }
    .count { font-weight: 750; color: var(--brand); }
    .brief-select { width: 100%; margin: 4px 0 14px; white-space: normal; }
    .brief { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.85 inherit; margin: 0; }
    .monthbar {
      display: grid;
      grid-template-columns: 52px 1fr 42px;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      margin: 13px 0;
    }
    .track { height: 12px; background: #eef3ef; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; background: var(--brand); border-radius: 6px; }
    .monthbar strong { text-align: right; font-size: 12px; }
    .full { grid-column: 1 / -1; }
    footer { text-align: center; font-size: 11px; color: var(--muted); padding: 20px 0 30px; }
    footer span { font-size: 10px; opacity: .8; }
    dialog {
      width: min(560px, calc(100% - 24px));
      max-height: 86dvh;
      border: 0;
      border-radius: 19px;
      padding: 22px;
      color: var(--ink);
      box-shadow: 0 24px 90px #0c332d33;
    }
    dialog::backdrop { background: #14342c66; backdrop-filter: blur(3px); }
    .dialog-head { margin-bottom: 12px; align-items: flex-start; }
    .dialog-head small { font-size: 10px; letter-spacing: .12em; color: var(--muted); }
    .dialog-head h2 { margin: 3px 0; font-size: 24px; }
    .dialog-head button { background: #edf2ee; border-radius: 50%; width: 32px; height: 32px; font-size: 22px; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 14px 0; }
    .detail-stat { background: var(--soft); border-radius: 10px; padding: 10px 8px; }
    .detail-stat small { display: block; color: var(--muted); font-size: 10px; }
    .detail-stat strong { display: block; font-size: 17px; margin-top: 4px; }
    .history { max-height: 250px; overflow: auto; }
    .history div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 12px; }
    @media (max-width: 700px) {
      .shell { padding: 0 14px; }
      header { padding: 18px 0 15px; }
      .identity b { font-size: 18px; }
      .identity small { font-size: 10px; }
      .logo { height: 40px; width: 40px; border-radius: 12px; }
      .controls { gap: 6px; }
      .groups { flex: 1; }
      .groups button { flex: 1; padding: 8px 10px; }
      .period-label { font-size: 0; }
      .period-label select { font-size: 12px; padding: 8px 6px; }
      .stats { gap: 6px; margin-bottom: 12px; }
      .stat { padding: 12px 8px; border-radius: 11px; }
      .stat label { font-size: 10px; }
      .stat strong { font-size: 24px; }
      .stat strong small { font-size: 10px; margin-left: 2px; }
      .stat p { font-size: 9px; }
      .grid { grid-template-columns: 1fr; gap: 0; }
      .panel { padding: 14px; margin-bottom: 12px; }
      .page-title { font-size: 23px; }
      .subtitle { margin-bottom: 12px; }
      .data-note { margin-bottom: 13px; font-size: 10px; }
      nav { justify-content: space-around; gap: 0; margin-top: 10px; }
      nav button { font-size: 13px; }
      .table-wrap { max-height: none; }
      th, td { padding: 8px 7px; min-width: 48px; }
      .tools { gap: 6px; }
      .tools select { font-size: 11px; padding: 8px 5px; max-width: 145px; }
      .detail-stat strong { font-size: 15px; }
    }

    /* Compact attendance views */
    .attendance-table { width: max-content; min-width: 100%; table-layout: fixed; }
    .attendance-table th, .attendance-table td { min-width: 30px; width: 30px; padding: 4px 2px; font-size: 10px; line-height: 1.25; }
    .attendance-table th:first-child, .attendance-table td:first-child { min-width: 62px; width: 62px; padding: 4px 3px; }
    .attendance-table .name-btn { display: block; width: 100%; font-size: 12px; min-height: 24px; line-height: 24px; }
    .attendance-table tbody td { padding-top: 1px; padding-bottom: 1px; }
    .attendance-table .count { min-width: 34px; width: 34px; font-size: 11px; }
    .attendance-table .yes { font-size: 0; }
    .attendance-table .yes::after { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--brand); vertical-align: middle; }
    .attendance-table .no { color: #c7d2cb; }
    #detail { padding: 16px; }
    #detail .dialog-head { margin-bottom: 6px; }
    #detail h3 { font-size: 15px; margin: 12px 0 6px; }
    #detail .detail-stats { margin: 8px 0; }
    #detail .detail-stat { padding: 7px; }
    .bar-scroll { overflow-x: auto; scrollbar-width: thin; }
    .member-bars { height: 142px; display: flex; gap: 6px; align-items: stretch; min-width: 100%; width: max-content; padding: 4px 2px; }
    .member-bar { flex: 1; min-width: 38px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 10px; }
    .member-bar strong { font-size: 12px; color: var(--brand); }
    .member-bar i { display: block; width: 70%; max-width: 42px; background: var(--brand); border-radius: 4px 4px 0 0; margin-top: 2px; }
    .member-bar span { border-top: 1px solid var(--line); width: 100%; text-align: center; padding-top: 3px; color: var(--muted); }
    .attendance-month { display: grid; grid-template-columns: 49px 1fr 28px; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); padding: 5px 0; font-size: 11px; }
    .attendance-days { display: flex; flex-wrap: wrap; gap: 3px; }
    .attendance-day { display: inline-grid; place-items: center; width: 26px; height: 25px; border-radius: 4px; background: var(--brand); color: white; font-size: 11px; }
    .attendance-month > span { color: var(--muted); text-align: right; }
  </style>
</head>
<body>
  <!-- ===== 비밀번호 잠금 화면 ===== -->
  <section id="lockScreen" class="lock-screen" aria-label="대시보드 비밀번호 입력">
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="logo lock-logo">GA<span>●</span></div>
      <h1 class="lock-title">함께 이어가는 회복</h1>
      <p class="lock-sub">신림수요 · 신림토요 모임 전용 대시보드입니다.<br>안내받은 비밀번호를 입력해 주세요.</p>
      <div class="pin-field">
        <input id="pinInput" type="password" inputmode="numeric" placeholder="비밀번호 입력" aria-label="비밀번호" required>
        <button type="button" id="pinToggle" class="pin-toggle" aria-label="비밀번호 표시 전환">👁</button>
      </div>
      <label class="keep-row">
        <input type="checkbox" id="keepLogin" checked>
        <span>7일간 로그인 유지</span>
      </label>
      <button type="submit" id="unlockBtn" class="lock-submit">대시보드 열기</button>
      <p id="lockError" class="lock-error" role="alert"></p>
      <p class="lock-hint">공용 기기에서는 '7일간 로그인 유지'를 해제하거나<br>조회 후 상단의 🔒 잠금 버튼을 눌러 주세요.</p>
    </form>
  </section>

  <!-- ===== GA 공유 대시보드 본문 (인증 통과 후 표시) ===== -->
  <div id="appShell" class="shell" hidden>
    <header>
      <div class="identity">
        <span class="logo">GA<span>●</span></span>
        <div>
          <b>함께 이어가는 회복</b>
          <small>신림수요 · 신림토요 모임 대시보드</small>
        </div>
      </div>
      <div class="header-actions">
        <span class="readonly" id="authBadge">조회 전용</span>
        <button type="button" class="lock-btn" id="lockBtn" title="로그아웃 및 잠금">🔒 잠금</button>
      </div>
    </header>

    <div class="controls">
      <div class="groups" aria-label="모임 선택">
        <button data-group="신림수요" class="active" aria-pressed="true">신림수요</button>

  <dialog id="detail">

  <script>
    (() => {
      const FIREBASE_PUBLIC_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app/ga-public/dashboard.json';
      const FIREBASE_ADMIN_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app/ga-admin/appData.json';
      const FIREBASE_BRIEFS_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app/ga-admin/briefings.json';
      const GAS_PUBLIC_URL = 'https://script.google.com/macros/s/AKfycbwWGnExweV-E4r5u_lNKi3Av0soVLTvt8VxwRrt0zdmuI-SdJ1JP0P_2zLKU5o5BcQ/exec';
      const CACHE_KEY = 'ga-public-dashboard-cache-v2';

      // ===== 4단계 비밀번호 인증 설정 =====
      const PIN_SALT = 'ga_sillim_salt_v1'; // Apps Script의 PIN_SALT와 동일해야 함
      const AUTH_STORAGE_KEY = 'ga_dashboard_auth_v1';
      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));

      let activeToken = '';
      let authExpiresAt = 0;
      let dashboardBooted = false;

      let data = null;
      let group = '신림수요';
      let tab = 'overview';
      let period = '3';
      let query = '';
      let scope = 'active';
      let sort = 'count';
      let briefId = '';
      let selectedSessionDate = '';
      let loading = false;

      // ===== SHA-256 해시 (Web Crypto 우선 + 비보안 환경용 순수 JS 폴백) =====
      function sha256Fallback(str) {
        const bytes = new TextEncoder().encode(str);
        const K = [
          0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
          0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
          0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
          0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
          0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
          0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
          0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
          0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
        ];
        const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const bitLen = bytes.length * 8;
        const arr = Array.from(bytes);
        arr.push(0x80);
        while (arr.length % 64 !== 56) arr.push(0);
        const hi = Math.floor(bitLen / 0x100000000);
        const lo = bitLen >>> 0;
        arr.push((hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff);
        arr.push((lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff);

        const rotr = (x, n) => (x >>> n) | (x << (32 - n));
        const w = new Uint32Array(64);
        for (let i = 0; i < arr.length; i += 64) {
          for (let j = 0; j < 16; j++) {
            w[j] = ((arr[i + j * 4] << 24) | (arr[i + j * 4 + 1] << 16) | (arr[i + j * 4 + 2] << 8) | arr[i + j * 4 + 3]) >>> 0;
          }
          for (let j = 16; j < 64; j++) {
            const s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
            const s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
            w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
          }
          let [a, b, c, d, e, f, g, h] = H;
          for (let j = 0; j < 64; j++) {
            const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
            const ch = (e & f) ^ (~e & g);
            const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
            const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const t2 = (S0 + maj) >>> 0;
            h = g; g = f; f = e; e = (d + t1) >>> 0;
            d = c; c = b; b = a; a = (t1 + t2) >>> 0;
          }
          H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
          H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
        }
        return H.map((v) => v.toString(16).padStart(8, '0')).join('');
      }

      async function makePinToken(pin) {
        const text = `${String(pin).trim()}::${PIN_SALT}`;
        if (window.crypto && window.crypto.subtle) {
          try {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
          } catch (_) {}
        }
        return sha256Fallback(text);
      }

      // ===== Apps Script JSONP 호출 (인증 검증 / 데이터 동기화 공용) =====
      function callGasJsonp(params, prefix = 'gaDashboardReceive') {
        return new Promise((resolve, reject) => {
          const cbName = `${prefix}_${Date.now()}${Math.random().toString(36).slice(2, 7)}`;
          const script = document.createElement('script');
          const cleanup = () => {
            clearTimeout(timer);
            script.remove();
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
          };
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('서버 응답 시간 초과'));
          }, 12000);

          window[cbName] = (payload) => {
            cleanup();
            resolve(payload);
          };
          script.onerror = () => {
            cleanup();
            reject(new Error('서버 연결 오류'));
          };

          const qs = new URLSearchParams({ ...params, callback: cbName, _: String(Date.now()) });
          script.src = `${GAS_PUBLIC_URL}?${qs.toString()}`;
          document.body.appendChild(script);
        });
      }

      async function verifyTokenWithServer(token) {
        return callGasJsonp({ action: 'verify', token }, 'gaDashboardAuth');
      }

      // ===== 4단계 세션 저장 · 검사 · 수동 잠금 · 무효화 =====
      function saveAuthSession(token, keep7Days) {
        activeToken = token;
        if (keep7Days) {
          authExpiresAt = Date.now() + SEVEN_DAYS_MS;
          try {
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ token, expiresAt: authExpiresAt }));
            sessionStorage.removeItem(AUTH_STORAGE_KEY);
          } catch (_) {}
        } else {
          authExpiresAt = 0;
          try {
            sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ token, expiresAt: 0 }));
            localStorage.removeItem(AUTH_STORAGE_KEY);
          } catch (_) {}
        }
      }

      function readSavedAuthSession() {
        try {
          const rawLocal = localStorage.getItem(AUTH_STORAGE_KEY);
          if (rawLocal) {
            const parsed = JSON.parse(rawLocal);
            if (parsed && parsed.token && typeof parsed.expiresAt === 'number') {
              if (Date.now() < parsed.expiresAt) {
                return { token: parsed.token, expiresAt: parsed.expiresAt, persistent: true };
              }
              // 2단계: 7일 만료 시 즉시 삭제
              localStorage.removeItem(AUTH_STORAGE_KEY);
            }
          }
          const rawSession = sessionStorage.getItem(AUTH_STORAGE_KEY);
          if (rawSession) {
            const parsed = JSON.parse(rawSession);
            if (parsed && parsed.token) {
              return { token: parsed.token, expiresAt: 0, persistent: false };
            }
          }
        } catch (_) {
          try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (_) {}
        }
        return null;
      }

      function clearAuthSession() {
        activeToken = '';
        authExpiresAt = 0;
        try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (_) {}
        try { sessionStorage.removeItem(AUTH_STORAGE_KEY); } catch (_) {}
      }

      function updateAuthBadge() {
        const badge = $('#authBadge');
        if (!badge) return;
        if (authExpiresAt > Date.now()) {
          const remainDays = Math.max(1, Math.ceil((authExpiresAt - Date.now()) / 86400000));
          badge.textContent = `7일 유지 중 · D-${remainDays}`;
        } else {
          badge.textContent = '임시 로그인';
        }
      }

      function showLockScreen(message = '') {
        clearAuthSession();
        dashboardBooted = false;
        if ($('#detail').open) $('#detail').close();
        $('#content').innerHTML = '';
        $('#appShell').hidden = true;
        $('#lockScreen').hidden = false;
        $('#pinInput').value = '';
        $('#lockError').textContent = message;
        setTimeout(() => $('#pinInput').focus(), 40);
      }

      function unlockAndBoot(token, expiresAt) {
        activeToken = token;
        authExpiresAt = expiresAt;
        $('#lockError').textContent = '';
        $('#lockScreen').hidden = true;
        $('#appShell').hidden = false;
        updateAuthBadge();

        if (!dashboardBooted) {
          dashboardBooted = true;
          bootDashboard();
        }
      }

      function triggerShake(msg) {
        $('#lockError').textContent = msg;
        const card = $('#lockForm');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }

      // ===== 기존 대시보드 로직 (100% 유지) =====
      function getKstToday() {
        const now = new Date();
        const kst = new Date(now.getTime() + 9 * 3600 * 1000);
        return kst.toISOString().slice(0, 10);
      }

      function shiftMonth(iso, amount) {
        if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
        const d = new Date(iso + 'T00:00:00Z');
        const day = d.getUTCDate();
        d.setUTCDate(1);
        d.setUTCMonth(d.getUTCMonth() + amount);
        const max = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
        d.setUTCDate(Math.min(day, max));
        return d.toISOString().slice(0, 10);
      }

      function computeMemberMetrics(member, fallbackAsOf, today) {
        let start = String(member.gamblingStartDate || member.startDate || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) {
          if (typeof member.days === 'number' && member.days >= 0 && /^\d{4}-\d{2}-\d{2}$/.test(fallbackAsOf)) {
            const base = new Date(fallbackAsOf + 'T00:00:00Z');
            start = new Date(base.getTime() - member.days * 86400000).toISOString().slice(0, 10);
          } else {
            start = '';
          }
        }

        if (!start || start > today) {
          return {
            ...member,
            gamblingStartDate: start,
            journey: member.journey || '',
            days: typeof member.days === 'number' ? member.days : null,
            celebrations: Array.isArray(member.celebrations) ? member.celebrations : []
          };
        }

        const a = new Date(start + 'T00:00:00Z');
        const b = new Date(today + 'T00:00:00Z');
        const days = Math.floor((b - a) / 86400000);
        let m = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth();
        if (shiftMonth(start, m) > today) m--;
        const rem = Math.floor((b - new Date(shiftMonth(start, m) + 'T00:00:00Z')) / 86400000);
        const journey = m >= 12
          ? Math.floor(m / 12) + '년' + (m % 12 ? ' ' + (m % 12) + '개월' : '')
          : m >= 1
            ? m + '개월' + (rem ? ' ' + rem + '일' : '')
            : days + '일';

        const celebrations = [];
        const end = shiftMonth(today.slice(0, 7) + '-01', 2);
        const hundred = new Date(+a + 100 * 86400000).toISOString().slice(0, 10);
        if (hundred.slice(0, 7) >= today.slice(0, 7) && hundred < end) {
          celebrations.push({ date: hundred, label: '100일' });
        }
        const startYearDiff = Math.max(1, b.getUTCFullYear() - a.getUTCFullYear());
        for (let y = startYearDiff; y <= b.getUTCFullYear() - a.getUTCFullYear() + 1; y++) {
          const anniversary = shiftMonth(start, y * 12);
          if (anniversary.slice(0, 7) >= today.slice(0, 7) && anniversary < end) {
            celebrations.push({ date: anniversary, label: y + '년' });
          }
        }

        return { ...member, gamblingStartDate: start, journey, days, celebrations };
      }

      function normalizeAndRecalculate(raw) {
        if (!raw || !Array.isArray(raw.members)) return null;
        const today = getKstToday();
        const fallbackAsOf = String(raw.asOf || today);

        const members = raw.members
          .filter((m) => m && m.id && m.name)
          .map((m) => computeMemberMetrics(m, fallbackAsOf, today));

        const rawRecords = Array.isArray(raw.records)
          ? raw.records
          : (Array.isArray(raw.attendanceRows) ? raw.attendanceRows : []);

        const seen = new Set();
        const records = [];
        rawRecords.forEach((r) => {
          if (!r) return;
          const date = String(r.date || '').slice(0, 10);
          const g = String(r.group || '');
          const memberId = String(r.memberId || r.id || '');
          if (!date || date > today || !memberId || (g !== '신림수요' && g !== '신림토요')) return;
          const key = `${g}|${date}|${memberId}`;
          if (seen.has(key)) return;
          seen.add(key);
          records.push({ date, group: g, memberId });
        });

        const cutoff = shiftMonth(today, -12);
        const rawBriefs = Array.isArray(raw.briefs)
          ? raw.briefs
          : (Array.isArray(raw.rows) ? raw.rows : []);

        const briefs = rawBriefs
          .map((b) => ({
            id: String(b.id || ''),
            group: String(b.group || ''),
            weekStart: String(b.weekStart || '').slice(0, 10),
            date: String(b.date || b.meetingDate || '').slice(0, 10),
            message: String(b.message || '')
          }))
          .filter((b) => b.id && b.date >= cutoff && b.date <= today && (b.group === '신림수요' || b.group === '신림토요'));

        return { asOf: today, loadedAt: new Date().toISOString(), mode: 'live', members, records, briefs };
      }

      const dateLabel = (d) => (d ? d.slice(2).replaceAll('-', '.') : '—');
      const journey = (m) => `<span>${esc(m.journey || '미확인')}</span>`;

      function compareJourney(a, b) {
        const da = typeof a.days === 'number' ? a.days : -1;
        const db = typeof b.days === 'number' ? b.days : -1;
        if (db !== da) return db - da;
        return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
      }

      function select(feed, targetGroup, targetPeriod) {
        const all = feed.records.filter((r) => r.group === targetGroup);
        const since = targetPeriod === 'all' ? '0000-00-00' : shiftMonth(feed.asOf, -Number(targetPeriod));
        const activeSince = shiftMonth(feed.asOf, -6);
        const active = new Set(
          all.filter((r) => r.date >= activeSince && r.date <= feed.asOf).map((r) => r.memberId)
        );
        const rows = all.filter((r) => r.date >= since && r.date <= feed.asOf);
        const dates = [...new Set(rows.map((r) => r.date))].sort((a, b) => b.localeCompare(a));
        return { all, rows, dates, since, active };
      }

      function months(rows) {
        const byMonth = new Map();
        rows.forEach((r) => {
          const m = r.date.slice(0, 7);
          if (!byMonth.has(m)) byMonth.set(m, { dates: new Set(), total: 0 });
          const item = byMonth.get(m);
          item.dates.add(r.date);
          item.total++;
        });
        return [...byMonth.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([month, info]) => ({
            month,
            total: info.total,
            meetings: info.dates.size,
            average: info.dates.size ? info.total / info.dates.size : 0
          }));
      }

      function memberList(feed, v, targetScope, q, targetSort) {
        const lastByMember = new Map();
        v.all.forEach((r) => {
          const prev = lastByMember.get(r.memberId);
          if (!prev || r.date > prev) lastByMember.set(r.memberId, r.date);
        });
        const countByMember = new Map();
        v.rows.forEach((r) => {
          countByMember.set(r.memberId, (countByMember.get(r.memberId) || 0) + 1);
        });
        const periodSet = new Set(v.rows.map((r) => r.memberId));
        const cleanQ = String(q || '').trim().toLowerCase();

        return feed.members
          .filter((m) => {
            const inScope = targetScope === 'period'
              ? periodSet.has(m.id)
              : (v.active.has(m.id) || (m.group === group && periodSet.has(m.id)));
            if (!inScope) return false;
            if (cleanQ && !String(m.name || '').toLowerCase().includes(cleanQ)) return false;
            return true;
          })
          .map((m) => ({
            ...m,
            last: lastByMember.get(m.id) || '',
            count: countByMember.get(m.id) || 0
          }))
          .sort((a, b) => {
            if (targetSort === 'latest') {
              return String(b.last).localeCompare(String(a.last)) || b.count - a.count || compareJourney(a, b);
            }
            return b.count - a.count || String(b.last).localeCompare(String(a.last)) || compareJourney(a, b);
          });
      }

      function person(m) {
        return `<button class="person" data-member="${esc(m.id)}"><b>${esc(m.name)}</b>${journey(m)}</button>`;
      }

      function chart(points, label, activeDate = '') {
        if (!points.length) return '<div class="empty">표시할 출석 기록이 없어.</div>';
        const w = 640, h = 205, left = 34, right = 15, top = 24, bottom = 33;
        const max = Math.max(4, ...points.map((p) => p.value));
        const cap = Math.ceil(max / 4) * 4;
        const x = (i) => left + (points.length === 1 ? (w - left - right) / 2 : i * (w - left - right) / (points.length - 1));
        const y = (v) => h - bottom - v * (h - top - bottom) / cap;

        let svg = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">`;
        for (let i = 0; i <= 4; i++) {
          const v = cap * i / 4;
          svg += `<line class="gridline" x1="${left}" y1="${y(v)}" x2="${w - right}" y2="${y(v)}"/>`;
          svg += `<text x="${left - 9}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
        }
        svg += `<polyline class="line" points="${points.map((p, i) => x(i) + ',' + y(p.value)).join(' ')}"/>`;
        points.forEach((p, i) => {
          const isSelected = p.date && p.date === activeDate;
          svg += `<circle class="dot${isSelected ? ' active' : ''}" cx="${x(i)}" cy="${y(p.value)}" r="${isSelected ? '6' : '3.6'}"><title>${esc(p.label)} · ${p.value}명</title></circle>`;
          if (p.date) {
            svg += `<circle class="hit" cx="${x(i)}" cy="${y(p.value)}" r="16" data-chart-date="${esc(p.date)}"></circle>`;
          }
          if (i === 0 || i === points.length - 1 || i % Math.max(1, Math.ceil(points.length / 6)) === 0) {
            svg += `<text x="${x(i)}" y="${h - 9}" text-anchor="middle">${esc(p.label)}</text>`;
          }
        });
        return svg + '</svg>';
      }

      function overview(v) {
        if (!v.dates.includes(selectedSessionDate)) {
          selectedSessionDate = v.dates[0] || '';
        }
        const currentIdx = v.dates.indexOf(selectedSessionDate);
        const hasPrevChronological = currentIdx >= 0 && currentIdx < v.dates.length - 1;
        const hasNextChronological = currentIdx > 0;
        const isLatestSession = currentIdx <= 0;

        const targetDate = selectedSessionDate || v.dates[0] || '';
        const sessionRows = v.rows.filter((r) => r.date === targetDate);
        const unique = new Set(v.rows.map((r) => r.memberId));
        const pointDates = [...v.dates].reverse();
        const trend = pointDates.map((d) => ({
          date: d,
          label: d.slice(5).replace('-', '/'),
          value: v.rows.filter((r) => r.date === d).length
        }));
        const monthly = months(v.rows);
        const max = Math.max(1, ...monthly.map((m) => m.average));
        const thisMonth = data.asOf.slice(0, 7);
        const nextMonth = shiftMonth(thisMonth + '-01', 1).slice(0, 7);
        const celebrationGroups = new Map();
        data.members
          .filter((m) => m.group === group && v.active.has(m.id) && m.celebrations?.length)
          .forEach((m) => {
            m.celebrations.forEach((c) => {
              const ym = String(c.date || '').slice(0, 7);
              if (!ym) return;
              if (!celebrationGroups.has(ym)) celebrationGroups.set(ym, []);
              celebrationGroups.get(ym).push({ member: m, label: c.label, ym });
            });
          });
        const celebrationSections = [...celebrationGroups.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([ym, items]) => {
            items.sort((a, b) => compareJourney(a.member, b.member));
            const ymText = `${ym.slice(2, 4)}년 ${Number(ym.slice(5, 7))}월`;
            const rel = ym === thisMonth ? '이번 달' : ym === nextMonth ? '다음 달' : '';
            const countText = `${rel ? rel + ' · ' : ''}${items.length}명`;
            return { ym, ymText, countText, items };
          });

        const firstStatCard = `
          <div class="stat">
            <label>${isLatestSession ? '최근 모임' : '선택 모임'}</label>
            <strong>${sessionRows.length}<small>명</small></strong>
            <div class="stat-nav">
              <button type="button" class="nav-arrow" data-nav="1" ${hasPrevChronological ? '' : 'disabled'} title="이전 모임">◀</button>
              <p style="margin:0;opacity:.95;font-weight:700">${targetDate ? dateLabel(targetDate) : '기록 없음'}</p>
              <button type="button" class="nav-arrow" data-nav="-1" ${hasNextChronological ? '' : 'disabled'} title="다음 모임">▶</button>
            </div>
          </div>`;

        const otherStatCards = [
          ['참석 회원', unique.size, '명', '선택 기간 · 중복 제외'],
          ['회당 평균', v.dates.length ? (v.rows.length / v.dates.length).toFixed(1) : '0.0', '명', '출석 저장 회차 기준'],
          ['모임 횟수', v.dates.length, '회', '선택 기간']
        ].map((a) => `<div class="stat"><label>${a[0]}</label><strong>${a[1]}<small>${a[2]}</small></strong><p>${a[3]}</p></div>`).join('');

        return `
          <h1 class="page-title">${esc(group)} 모임 현황</h1>
          <p class="subtitle">${period === 'all' ? '전체 기록' : dateLabel(v.since) + ' – ' + dateLabel(data.asOf)} · 함께한 시간의 기록</p>
          <div class="stats">${firstStatCard}${otherStatCards}</div>
          <div class="grid">
            <section class="panel">
              <div class="section-head">
                <h2>회차별 참석 인원</h2>
                ${targetDate ? `<span class="point-badge">📅 ${dateLabel(targetDate)} · 참석 ${sessionRows.length}명</span>` : '<span>단위 · 명</span>'}
              </div>
              ${chart(trend, '회차별 참석 인원', targetDate)}
              <p class="caption">점을 누르면 해당 날짜와 인원이 표시되고 아래 참석자 명단도 함께 전환돼.</p>
            </section>
            <section class="panel">
              <div class="section-head"><h2>월별 평균 참석 인원</h2><span>회당 · 명</span></div>
              ${monthly.length ? monthly.map((m) => `
                <div class="monthbar">
                  <span>${m.month.slice(2).replace('-', '.')}</span>
                  <div class="track"><div class="fill" style="width:${(m.average / max) * 100}%"></div></div>
                  <strong>${m.average.toFixed(1)}</strong>
                </div>`).join('') : '<div class="empty">표시할 기록이 없어.</div>'}
              <p class="caption">월 누적 출석 인원 ÷ 출석이 저장된 모임 횟수</p>
            </section>
            <section class="panel">
              <div class="section-head">
                <h2>${isLatestSession ? '최근 모임 참석자' : '선택 모임 참석자'}</h2>
                <div class="session-nav-wrap">
                  <button type="button" class="nav-arrow light" data-nav="1" ${hasPrevChronological ? '' : 'disabled'} title="이전 회차">◀</button>
                  <span>${targetDate ? dateLabel(targetDate) : ''} · ${sessionRows.length}명</span>
                  <button type="button" class="nav-arrow light" data-nav="-1" ${hasNextChronological ? '' : 'disabled'} title="다음 회차">▶</button>
                </div>
              </div>
              <div class="list">
                ${sessionRows.map((r) => data.members.find((m) => m.id === r.memberId)).filter(Boolean).sort(compareJourney).map(person).join('') || '<div class="empty">출석 기록이 없어.</div>'}
              </div>
            </section>
            <section class="panel">
              <div class="section-head"><h2>다가오는 잔치</h2><span>이번 달 · 다음 달</span></div>
              ${celebrationSections.length ? celebrationSections.map((sec) => `
                <div class="celebration-group">
                  <div class="celebration-month-head">
                    <b>${sec.ymText}</b>
                    <span>${sec.countText}</span>
                  </div>
                  <div class="list">
                    ${sec.items.map((item) => `
                      <button class="person" data-member="${esc(item.member.id)}">
                        <b>${esc(item.member.name)}</b>
                        <span class="celebration">${sec.ymText} · ${esc(item.label)}</span>
                      </button>`).join('')}
                  </div>
                </div>`).join('') : '<div class="empty">등록된 잔치 일정이 없어.</div>'}
              <p class="caption">해당 모임 소속 · 최근 6개월 참석 회원 기준 · 오늘 날짜 기준 자동 계산</p>
            </section>
          </div>`;
      }

      function roster(v) {
        return `
          <h1 class="page-title">회원별 출석</h1>
          <p class="subtitle">${esc(group)} 출석 기준 · 최근 날짜부터 표시</p>
          <div class="tools">
            <input id="search" type="search" placeholder="활동명 검색" aria-label="활동명 검색" value="${esc(query)}">
            <select id="scope" aria-label="회원 범위">
              <option value="active" ${scope === 'active' ? 'selected' : ''}>최근 6개월 참석 회원</option>
              <option value="period" ${scope === 'period' ? 'selected' : ''}>조회 기간 참석 회원</option>
            </select>
            <select id="sort" aria-label="정렬">
              <option value="latest" ${sort === 'latest' ? 'selected' : ''}>최근 출석순</option>
              <option value="count" ${sort === 'count' ? 'selected' : ''}>출석횟수순</option>
            </select>
          </div>
          <div id="rosterTable">${table(v)}</div>
          <p class="caption">초록 칸: 참석 · 점: 명단에 없음 · 이름을 누르면 상세 기록 · 날짜 영역은 좌우로 넘길 수 있어.</p>`;
      }

      function table(v) {
        const list = memberList(data, v, scope, query, sort);
        const attended = new Set(v.rows.map((r) => r.memberId + '|' + r.date));
        return `
          <p class="subtitle">${list.length}명 · ${v.dates.length}회 모임</p>
          <div class="table-wrap">
            <table class="attendance-table">
              <thead>
                <tr>
                  <th>활동명</th>
                  <th class="count">출석</th>
                  ${v.dates.map((d) => `<th>${d.slice(2, 4)}년<br>${d.slice(5).replace('-', '/')}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${list.map((m) => `
                  <tr>
                    <td><button class="name-btn" data-member="${esc(m.id)}">${esc(m.name)}</button></td>
                    <td class="count">${m.count}회</td>
                    ${v.dates.map((d) => `<td class="${attended.has(m.id + '|' + d) ? 'yes' : 'no'}" aria-label="${esc(m.name)} ${d} ${attended.has(m.id + '|' + d) ? '참석' : '명단에 없음'}">${attended.has(m.id + '|' + d) ? '●' : '·'}</td>`).join('')}
                  </tr>`).join('') || `<tr><td colspan="${v.dates.length + 2}">조건에 맞는 회원이 없어.</td></tr>`}
              </tbody>
            </table>
          </div>`;
      }

      function briefing() {
        const rows = data.briefs
          .filter((b) => b.group === group && b.date >= shiftMonth(data.asOf, -12))
          .sort((a, b) => b.date.localeCompare(a.date));
        const chosen = rows.find((b) => b.id === briefId) || rows[0];
        return `
          <h1 class="page-title">모임 브리핑</h1>
          <p class="subtitle">최근 1년 · 최신 기록부터 표시</p>
          ${rows.length ? `
            <select id="briefSelect" class="brief-select" aria-label="브리핑 주차">
              ${rows.map((b) => `<option value="${esc(b.id)}" ${b === chosen ? 'selected' : ''}>${dateLabel(b.weekStart)} 주간 · 모임 ${dateLabel(b.date)}</option>`).join('')}
            </select>
            <section class="panel"><div class="brief">${esc(chosen.message)}</div></section>
          ` : '<div class="panel empty">저장된 브리핑이 없어.</div>'}`;
      }

      function memberBars(rows, v) {
        const totals = new Map(months(rows).map(m => [m.month, m.total]));
        const first = period === 'all' ? (v.dates.at(-1) || data.asOf).slice(0, 7) : v.since.slice(0, 7);
        const points = [];
        for (let month = first + '-01'; month <= data.asOf; month = shiftMonth(month, 1)) {
          points.push({ month: month.slice(0, 7), value: totals.get(month.slice(0, 7)) || 0 });
        }
        const max = Math.max(1, ...points.map(p => p.value));
        return `<div class="bar-scroll" tabindex="0" aria-label="월별 출석 그래프, 좌우 스크롤"><div class="member-bars">${points.map(p => `<div class="member-bar" aria-label="${p.month} ${p.value}회"><strong>${p.value}회</strong><i style="height:${p.value / max * 96}px"></i><span>${p.month.slice(2).replace('-', '.')}</span></div>`).join('')}</div></div>`;
      }

      function compactHistory(history) {
        const grouped = new Map();
        history.forEach(r => {
          const month = r.date.slice(0, 7);
          if (!grouped.has(month)) grouped.set(month, []);
          grouped.get(month).push(r);
        });
        return [...grouped].map(([month, rows]) => `<div class="attendance-month"><b>${month.slice(2).replace('-', '.')}</b><div class="attendance-days">${[...rows].sort((a,b) => a.date.localeCompare(b.date)).map(r => `<span class="attendance-day" title="${esc(r.date)} · ${esc(r.group)}" aria-label="${esc(r.date)} ${esc(r.group)} 참석">${r.date.slice(8)}</span>`).join('')}</div><span>${rows.length}회</span></div>`).join('') || '<p class="empty">이 모임의 기록이 없어.</p>';
      }

      function detail(id) {
        const m = data.members.find((item) => item.id === id);
        if (!m) return;
        const v = select(data, group, period);
        const history = v.all.filter((r) => r.memberId === id).sort((a, b) => b.date.localeCompare(a.date));
        const count = v.rows.filter((r) => r.memberId === id).length;
        const total = data.records.filter((r) => r.memberId === id).length;
        const startLabel = m.gamblingStartDate ? ` · 마지막 도박일 ${dateLabel(m.gamblingStartDate)}` : '';

        $('#detailTitle').textContent = m.name;
        $('#detailBody').innerHTML = `
          <div>${journey(m)}<span class="tag">${esc(group)} 기준${esc(startLabel)}</span></div>
          <div class="detail-stats">
            <div class="detail-stat"><small>조회 기간 출석</small><strong>${count}회</strong></div>
            <div class="detail-stat"><small>이 모임 전체</small><strong>${history.length}회</strong></div>
            <div class="detail-stat"><small>두 모임 합계</small><strong>${total}회</strong></div>
          </div>
          <h3>월별 출석</h3>
          <p class="caption">표시된 달의 전체 출석 기준 · 조회 기간 합계와는 범위가 다를 수 있어.</p>
          ${memberBars(history, v)}
          <h3>출석 기록 <small style="font-size:11px;color:var(--muted)">${esc(group)} · 전체</small></h3>
          <p class="caption">월별 출석일 · 초록 칸의 숫자는 일자야.</p>
          <div class="attendance-history">${compactHistory(history)}</div>`;
        $('#detail').showModal();
      }

      function render() {
        if (!data || !activeToken) return;
        const v = select(data, group, period);
        $('#content').innerHTML = tab === 'overview' ? overview(v) : tab === 'members' ? roster(v) : briefing();
        document.querySelectorAll('[data-group]').forEach((b) => {
          b.classList.toggle('active', b.dataset.group === group);
          b.setAttribute('aria-pressed', b.dataset.group === group);
        });
        document.querySelectorAll('[data-tab]').forEach((b) => {
          b.classList.toggle('active', b.dataset.tab === tab);
          b.toggleAttribute('aria-current', b.dataset.tab === tab);
          if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page');
        });
      }

      function showUpdateNote(message) {
        const note = $('#dataNote');
        note.innerHTML = '';
        const span = document.createElement('span');
        span.textContent = message;
        const button = document.createElement('button');
        button.className = 'refresh-feed';
        button.textContent = loading ? '확인 중…' : '최신 기록 확인';
        button.disabled = loading;
        button.onclick = () => loadFeed(true);
        note.append(span, button);
      }

      async function fetchJson(url) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) return null;
          return await res.json();
        } catch (_) {
          return null;
        }
      }

      async function fetchFromGasJsonp() {
        const payload = await callGasJsonp({ token: activeToken }, 'gaDashboardReceive');
        if (payload && payload.ok === false && payload.error === 'INVALID_PIN') {
          const err = new Error('INVALID_PIN');
          err.code = 'INVALID_PIN';
          throw err;
        }
        return payload;
      }

      async function loadFeed(forceSheetSync = false) {
        if (loading || !activeToken) return;
        loading = true;
        showUpdateNote(data ? `최근 확인한 기록 · ${dateLabel(data.asOf)} 기준 · 클라우드 확인 중…` : 'Firebase 클라우드에서 출석 기록을 불러오고 있어…');

        try {
          let cloudPayload = await fetchJson(FIREBASE_PUBLIC_URL);

          if (!cloudPayload || !Array.isArray(cloudPayload.members)) {
            const [adminData, adminBriefs] = await Promise.all([
              fetchJson(FIREBASE_ADMIN_URL),
              fetchJson(FIREBASE_BRIEFS_URL)
            ]);
            if (adminData && Array.isArray(adminData.members)) {
              cloudPayload = {
                asOf: getKstToday(),
                members: adminData.members,
                records: adminData.attendanceRows || [],
                briefs: (adminBriefs && adminBriefs.rows) ? adminBriefs.rows : []
              };
            }
          }

          if (cloudPayload && Array.isArray(cloudPayload.members) && !forceSheetSync) {
            data = normalizeAndRecalculate(cloudPayload);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
            loading = false;
            render();
            showUpdateNote(`클라우드 최신 기록 · ${dateLabel(data.asOf)} 기준 (오늘 날짜 자동 반영됨)`);
            return;
          }

          const sheetPayload = await fetchFromGasJsonp();
          if (sheetPayload && Array.isArray(sheetPayload.members)) {
            data = normalizeAndRecalculate(sheetPayload);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
            fetch(FIREBASE_PUBLIC_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }).catch(() => {});
            loading = false;
            render();
            showUpdateNote(`클라우드 · 시트 동기화 완료 · ${dateLabel(data.asOf)} 기준`);
            return;
          }
          throw new Error('데이터를 찾지 못했어.');
        } catch (err) {
          loading = false;
          // 4단계: 시트 동기화 중 비밀번호 변경 감지 시 즉시 잠금
          if (err && err.code === 'INVALID_PIN') {
            showLockScreen('비밀번호가 변경되어 재인증이 필요합니다.');
            return;
          }
          showUpdateNote(data ? `저장된 기록 표시 중 · ${dateLabel(data.asOf)} 기준` : '출석 기록을 불러오지 못했어. 잠시 후 다시 확인해줘.');
        }
      }

      function bootDashboard() {
        try {
          const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (cached && Array.isArray(cached.members)) {
            data = normalizeAndRecalculate(cached);
            render();
          }
        } catch (_) {}
        loadFeed(false);
      }

      // ===== 잠금 화면 & 대시보드 이벤트 연결 =====
      $('#pinToggle').onclick = () => {
        const input = $('#pinInput');
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        $('#pinToggle').textContent = isPw ? '🙈' : '👁';
      };

      $('#lockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pin = $('#pinInput').value.trim();
        if (!pin) {
          triggerShake('비밀번호를 입력해 주세요.');
          return;
        }
        const btn = $('#unlockBtn');
        btn.disabled = true;
        btn.textContent = '확인 중…';
        $('#lockError').textContent = '';

        try {
          const token = await makePinToken(pin);
          const res = await verifyTokenWithServer(token);
          if (res && res.ok) {
            // 1단계: 인증 성공 시 만료 시각 저장
            const keep = $('#keepLogin').checked;
            saveAuthSession(token, keep);
            unlockAndBoot(token, keep ? authExpiresAt : 0);
          } else {
            triggerShake((res && res.message) || '비밀번호가 올바르지 않습니다.');
            $('#pinInput').select();
          }
        } catch (_) {
          triggerShake('인증 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
          btn.disabled = false;
          btn.textContent = '대시보드 열기';
        }
      });

      // 3단계: 수동 잠금(로그아웃)
      $('#lockBtn').onclick = () => {
        showLockScreen('');
      };

      document.addEventListener('click', (e) => {
        if (!activeToken) return;
        const g = e.target.closest('[data-group]');
        const t = e.target.closest('[data-tab]');
        const m = e.target.closest('[data-member]');
        const navBtn = e.target.closest('[data-nav]');
        const chartPoint = e.target.closest('[data-chart-date]');

        if (g) {
          group = g.dataset.group;
          briefId = '';
          selectedSessionDate = '';
          render();
        }
        if (t) {
          tab = t.dataset.tab;
          render();
        }
        if (m) {
          detail(m.dataset.member);
        }
        if (navBtn && data) {
          const v = select(data, group, period);
          const idx = v.dates.indexOf(selectedSessionDate || v.dates[0]);
          const nextIdx = idx + Number(navBtn.dataset.nav);
          if (nextIdx >= 0 && nextIdx < v.dates.length) {
            selectedSessionDate = v.dates[nextIdx];
            render();
          }
        }
        if (chartPoint) {
          selectedSessionDate = chartPoint.dataset.chartDate;
          render();
        }
      });

      $('#period').onchange = (e) => {
        period = e.target.value;
        selectedSessionDate = '';
        render();
      };

      document.addEventListener('change', (e) => {
        if (e.target.id === 'scope') { scope = e.target.value; render(); }
        if (e.target.id === 'sort') { sort = e.target.value; render(); }
        if (e.target.id === 'briefSelect') { briefId = e.target.value; render(); }
      });

      document.addEventListener('input', (e) => {
        if (e.target.id === 'search') {
          query = e.target.value;
          $('#rosterTable').innerHTML = table(select(data, group, period));
        }
      });

      $('#closeDetail').onclick = () => $('#detail').close();
      $('#detail').addEventListener('click', (e) => {
        if (e.target === $('#detail')) {
          const r = e.target.getBoundingClientRect();
          if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
            e.target.close();
          }
        }
      });

      // ===== 2단계 & 4단계: 접속 시 자동 검사 + 백그라운드 비밀번호 변경 검증 =====
      const saved = readSavedAuthSession();
      if (saved) {
        unlockAndBoot(saved.token, saved.expiresAt);
        // 백그라운드에서 서버 비밀번호 변경 여부 대조 (네트워크 일시 장애 시에는 유지, 명확한 INVALID_PIN일 때만 즉시 잠금)
        verifyTokenWithServer(saved.token)
          .then((res) => {
            if (res && res.ok === false && res.error === 'INVALID_PIN') {
              showLockScreen('비밀번호가 변경되어 재인증이 필요합니다.');
            }
          })
          .catch(() => {});
      } else {
        showLockScreen('');
      }
    })();
  </script>
</body>
</html>
